name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 🎯 এই সেই ম্যাজিক স্টেপ যা Java 17 নিশ্চিত করবে!
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config cmake libffi-dev libssl-dev libltdl-dev zlib1g-dev
    
    - name: Install Python Dependencies & Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.33 virtualenv buildozer
    
    - name: Clear cache and SDK (Fixing Environment)
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_HOME
    
    - name: Build APK with Buildozer
      run: |
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        yes | buildozer -v android debug
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyLoad-APK
        path: bin/*.apk
        retention-days: 30
