name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          python3-dev \
          python3-setuptools
    
    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools wheel
    
    - name: Install Cython (specific version for stability)
      run: |
        pip install cython==0.29.33
    
    - name: Install Buildozer
      run: |
        pip install buildozer
    
    - name: Create assets directory
      run: |
        mkdir -p assets
    
    - name: Create placeholder logo (if not exists)
      run: |
        if [ ! -f assets/logo.png ]; then
          echo "Creating placeholder logo..."
          # Create a simple 512x512 placeholder image
          convert -size 512x512 xc:#00D2A0 -gravity center -pointsize 72 -fill white -annotate +0+0 "AL" assets/logo.png || echo "ImageMagick not available, skipping logo creation"
        fi
    
    - name: Download NotoSans font (if not exists)
      run: |
        if [ ! -f assets/NotoSans-Regular.ttf ]; then
          echo "Downloading NotoSans font..."
          wget -q https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf -O assets/NotoSans-Regular.ttf || echo "Font download failed, continuing..."
        fi
    
    - name: Verify buildozer.spec exists
      run: |
        if [ ! -f buildozer.spec ]; then
          echo "ERROR: buildozer.spec not found!"
          exit 1
        fi
        echo "buildozer.spec found ✓"
    
    - name: Clear buildozer cache (fresh build)
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer
    
    - name: Fix Android SDK environment (CRITICAL)
      run: |
        # Unset GitHub's pre-configured Android paths
        # This forces Buildozer to download and use its own SDK/NDK
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_HOME
        echo "Android environment variables cleared ✓"
    
    - name: Build APK with Buildozer
      run: |
        # Unset Android paths again (in case they were reset)
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_HOME
        
        # Run buildozer with verbose output
        buildozer -v android debug
      env:
        # Ensure environment is clean
        ANDROID_HOME: ""
        ANDROID_SDK_ROOT: ""
        ANDROID_NDK_HOME: ""
    
    - name: Verify APK was created
      run: |
        if [ -f bin/*.apk ]; then
          echo "APK build successful ✓"
          ls -lh bin/*.apk
        else
          echo "ERROR: APK not found!"
          exit 1
        fi
    
    - name: Rename APK with timestamp
      run: |
        cd bin
        APK_FILE=$(ls *.apk | head -n 1)
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        NEW_NAME="AnyLoad_v1.1.0_${TIMESTAMP}.apk"
        mv "$APK_FILE" "$NEW_NAME"
        echo "APK renamed to: $NEW_NAME"
        echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyLoad-APK
        path: bin/*.apk
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App:** AnyLoad v1.1.0" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** com.nirob.anyload" >> $GITHUB_STEP_SUMMARY
        echo "**Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 APK Details" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        ls -lh bin/*.apk >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
